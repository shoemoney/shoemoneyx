name: image

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Fails fast on a broken Dockerfile before anything gets tagged: single-arch, build only, no push.
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [app, nginx]
    steps:
      - uses: actions/checkout@v4

      - name: Decrypt Font Awesome Pro
        env:
          FA_PRO_KEY: ${{ secrets.FA_PRO_KEY }}
        run: openssl enc -d -aes-256-cbc -pbkdf2 -pass env:FA_PRO_KEY -in ops/ci/fa-pro.tar.gz.enc | tar xzf -

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: app
            image: ghcr.io/${{ github.repository_owner }}/shoemoneyx
          - target: nginx
            image: ghcr.io/${{ github.repository_owner }}/shoemoneyx-nginx
    steps:
      - uses: actions/checkout@v4

      - name: Decrypt Font Awesome Pro
        env:
          FA_PRO_KEY: ${{ secrets.FA_PRO_KEY }}
        run: openssl enc -d -aes-256-cbc -pbkdf2 -pass env:FA_PRO_KEY -in ops/ci/fa-pro.tar.gz.enc | tar xzf -

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
