name: test

on:
  push:
    branches: ['**']
  pull_request:
  # image.yml calls this so a tag build cannot publish unless the suite is green.
  workflow_call:

permissions:
  contents: read

jobs:
  # php artisan test — sqlite :memory: per phpunit.xml; Tests\TestCase calls withoutVite()
  # so no npm build is needed. Redis is a real dependency (CandleStore keeps its
  # candle-version counters on the default Redis connection, shared with the feeder),
  # so the suite runs against a live redis service exactly like docker-compose does.
  php:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine@sha256:47b08295737773de3b711fb86f13ae802f5074e96a9a2d29f5f80164ac08c046
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, gmp
          coverage: none
      - name: Copy .env
        run: cp .env.example .env
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Generate key
        run: php artisan key:generate
      - run: php artisan test

  # Same suite on the production engine. The default job above is sqlite :memory:, which hides
  # column widths, collation, timezone and engine behaviour. Fresh MariaDB 13 (utf8mb4_unicode_ci,
  # strict), migrations run for real. The complete unfiltered suite is a hard gate.
  php-mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:13@sha256:4844586367ef1b639ae699953e00a6a18f460f700e52df00401e1101a6ef2450
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: shoemoneyx_test
          MARIADB_AUTO_UPGRADE: "1"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine@sha256:47b08295737773de3b711fb86f13ae802f5074e96a9a2d29f5f80164ac08c046
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: shoemoneyx_test
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_URL: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: bcmath, gmp, pdo_mysql
          coverage: none
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist
      - run: php artisan key:generate
      - name: Migrate fresh (every migration on MariaDB)
        run: php artisan migrate:fresh --force
      - name: Test (complete MariaDB suite)
        run: php artisan test

  # node --test over the resources/js module graph — resources/js and
  # tests/Unit/Frontend import vue and @vue/compiler-sfc, so node_modules must
  # have them. Installed into an isolated manifest (not the repo's full
  # package.json/node_modules) and copied into the workspace, purely to keep
  # this job fast — a plain `npm ci` from the repo root would also work now.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install frontend test deps
        run: |
          mkdir -p "$RUNNER_TEMP/fedeps" && cd "$RUNNER_TEMP/fedeps"
          npm init -y >/dev/null
          npm install --no-package-lock vue@^3.5.42 @vue/compiler-sfc@^3.5.42
          mkdir -p "$GITHUB_WORKSPACE/node_modules"
          cp -R "$RUNNER_TEMP/fedeps/node_modules/." "$GITHUB_WORKSPACE/node_modules/"
      - run: npm run test:frontend

  # feeder/feed.mjs imports ws/ioredis/mysql2, so this needs a real npm ci over
  # the repo's own package.json. Runs for every PR including forks now that
  # Font Awesome is the free set and no secret gates the install.
  feeder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - run: npm run test:feeder

  # Exercise the AMI acceptance script without creating cloud resources or making network calls.
  image-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check image script syntax
        run: bash -n ops/image/test-boot.sh ops/image/files/acme.sh
      - name: Test certificate lifecycle with local stubs
        run: bash ops/image/test-acme.sh
      - name: Test boot acceptance with local stubs
        run: python3 -B ops/image/test-test-boot.py
