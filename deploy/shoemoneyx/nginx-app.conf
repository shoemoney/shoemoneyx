root /var/www/shoemoneyx.com/current/public;
index index.php;
charset utf-8;
client_max_body_size 1m;
access_log /var/log/nginx/shoemoneyx-access.log;
error_log /var/log/nginx/shoemoneyx-error.log;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml;
location /.well-known/acme-challenge/ { root /var/www/html; }
location /build/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}
location ~ /\.(?!well-known) { deny all; }
location / { try_files $uri /index.php?$query_string; }
location = /index.php {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_pass unix:/run/php/shoemoneyx-fpm.sock;
    fastcgi_hide_header X-Powered-By;
}
location ~ \.php$ { return 404; }
location ~* \.(?:js|css|webp|png|jpe?g|gif|svg|woff2?|ttf|mp3|webm|mp4|ico)$ {
    try_files $uri =404;
    expires 7d;
    access_log off;
}
