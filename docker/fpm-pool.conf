; php-fpm pool sized for a 2 GB t3.small shared with mariadb, redis, desk, queue and reverb.
; Overrides the image's default www pool; loaded last (zz-). Each worker is capped by memory_limit,
; so max_children x memory_limit bounds the web container (see mem_limit in docker-compose.yml).
[www]
pm = dynamic
pm.max_children = 4
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 500
request_terminate_timeout = 120s
php_admin_value[memory_limit] = 128M
