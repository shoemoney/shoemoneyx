# shoemoneyx desk (docker) — HTTPS only. Adapted from ops/image/files/nginx-shoemoneyx.conf (the
# AMI's conf) for the compose topology: fastcgi goes to the `web` service instead of a local
# socket, and a websocket location proxies to the `reverb` service — the AMI exposes Reverb
# directly, but compose here publishes only 443, so Reverb has to ride through nginx too.
# Resolve the compose service names through Docker's embedded DNS on every use instead of once
# at startup: a recreated web/reverb container gets a new IP, and a static upstream would 502
# until nginx itself restarted (reproduced on the AMI's first boot).
server {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web_upstream web:9000;
    set $reverb_upstream reverb:8812;

    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    root /app/public;
    index index.php;

    ssl_certificate     /etc/ssl/shoemoneyx/selfsigned.crt;
    ssl_certificate_key /etc/ssl/shoemoneyx/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 32M;

    location /app/ {
        proxy_pass http://$reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass $web_upstream;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
