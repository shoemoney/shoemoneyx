# shoemoneyx desk — HTTPS only. Baked at build time with a self-signed cert;
# first-boot.sh swaps in a real one via certbot when a DOMAIN tag is present.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    root /opt/shoemoneyx/public;
    index index.php;

    ssl_certificate     /etc/ssl/shoemoneyx/selfsigned.crt;
    ssl_certificate_key /etc/ssl/shoemoneyx/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 32M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
